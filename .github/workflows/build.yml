name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "===== root ====="
          ls -a
          echo "===== app files ====="
          find app -type f | sort
          echo "===== workflows ====="
          ls -a .github/workflows || echo "no workflows dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK path: $SDK"
          echo "--- platforms ---"
          ls "$SDK/platforms" 2>/dev/null || echo "no platforms dir"
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "no build-tools dir"

      - name: Fix SDK permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null || true

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=""
          for p in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/16.0/bin/sdkmanager" "$SDK/cmdline-tools/15.0/bin/sdkmanager" "$SDK/cmdline-tools/14.0/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SM="$p"; break; fi
          done
          if [ -z "$SM" ]; then
            SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager: ${SM:-not found}"
          if [ -n "$SM" ]; then
            yes 2>/dev/null | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "--- platforms after install ---"
          ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools after install ---"
          ls "$SDK/build-tools" 2>/dev/null || true
          exit 0

      - name: Install Gradle 8.9
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/gradle-dist"
          curl -sSL -o "$RUNNER_TEMP/gradle-dist/gradle.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q -o "$RUNNER_TEMP/gradle-dist/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
          chmod +x "$RUNNER_TEMP/gradle-dist/gradle-8.9/bin/gradle"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          java -version 2>&1 | head -n 2
          gradle --version | head -n 6

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: punch-daka-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs
          if-no-files-found: ignore
